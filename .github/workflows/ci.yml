name: Core and migration tool

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 6.0.428
      - name: Run synthetic core tests
        run: dotnet run --project tests/Tests.csproj -c Release
      - name: Build migration tool
        run: dotnet build src/Migrate/Migrate.csproj -c Release --nologo
